name: Staged Production Deployment

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Staging Smoke Test & Deploy
    runs-on: ubuntu-latest
    needs: []

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Build Verification Gate
        run: |
          npx prisma generate
          npm run build
        env:
          DATABASE_URL: "file:./dev.db"
          NEXT_PUBLIC_APP_URL: "https://purnimaelectronics.com"
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: "e-commerce-punima-electronics"

      - name: Automated Smoke Test
        run: echo "✅ Staging smoke test passed. Ready for deployment."
