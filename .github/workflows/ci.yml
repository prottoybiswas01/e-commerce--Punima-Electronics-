name: Continuous Integration & Typecheck

on:
  push:
    branches: [main, master, "ai/fix/**"]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    name: Build & Verify Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: "file:./dev.db"

      - name: Run TypeScript Compiler Check
        run: npx tsc --noEmit

      - name: Verify Production Build
        run: npm run build
        env:
          DATABASE_URL: "file:./dev.db"
          NEXT_PUBLIC_APP_URL: "http://localhost:3000"
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY || 'dummy_api_key' }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: "e-commerce-punima-electronics"
